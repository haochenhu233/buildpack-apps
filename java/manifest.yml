applications:
- name: bptest-java
  memory: 1G
  buildpacks: [java_buildpack]
  stack: cflinuxfs4
  path: target/bptest-java-1.0.0.jar
  env:
    # jbp 5.0.2 defaults to JRE 17. Pin to the newest JRE the buildpack bundles (25.0.11).
    # UNQUOTED keys, new version scheme (not { "jre": {...} }, not 1.8.0_+).
    JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
# The jar is a prebuilt Java 25 fat JAR committed for the air-gap (see repo README).
# To rebuild: mvn -DskipTests package  (needs JDK 25), then git add -f the jar.
# JREs bundled in jbp 5.0.2: 8.0.492, 11.0.31, 17.0.19, 21.0.11, 25.0.3 (newest).
