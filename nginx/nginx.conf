worker_processes auto;
daemon off;
events { worker_connections 1024; }

http {
  server {
    listen {{port}};
    root public;

    # Resolver driven by the DNS_IP env var — reproduces the jammy(169.254.0.2) ->
    # noble(169.254.0.53) break. If DNS_IP is wrong, /proxy/ returns 502 with
    # "Connection refused (111) while resolving".
    resolver {{env "DNS_IP"}} valid=10s ipv6=off;

    location = / { try_files /index.html =404; }

    # Forces a RUNTIME DNS lookup through the resolver above (variable upstream).
    location /proxy/ {
      set $upstream "example.com";
      proxy_pass https://$upstream/;
    }
  }
}
