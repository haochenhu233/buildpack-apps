applications:
- name: bptest-ruby
  memory: 256M
  buildpacks: [ruby_buildpack]
  stack: cflinuxfs4
# Gemfile.lock and vendor/cache/ are committed so the app stages offline in the
# air-gap. The buildpack installs the cached gems without reaching rubygems.org.
# puma and nio4r are cached as source gems and compiled on the cflinuxfs4 cell.
# To refresh after changing the Gemfile, re-run bundle lock + bundle cache for the
# x86_64-linux platform (a linux/amd64 ruby:3.4 container), then git add the results.
